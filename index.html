<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NAIJA TURF: ZOI - Living Lagos Sim</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap');
    * { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    #canvas3d { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex justify-center items-center overflow-hidden">

  <!-- Main Game Container -->
  <div id="gameContainer" class="w-full max-w-[430px] h-[100dvh] bg-gray-900 flex flex-col justify-between relative shadow-2xl border-x border-gray-800">

    <!-- Top HUD: Character Vitals & Currency -->
    <header class="p-3 bg-emerald-950/90 border-b border-emerald-800/80 flex justify-between items-center z-20">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full bg-amber-400 border-2 border-emerald-400 flex items-center justify-center font-black text-black text-base" id="avatarBadge">
          😎
        </div>
        <div>
          <h1 class="text-xs font-black text-white" id="zoiName">Lagos Zoi</h1>
          <span class="text-[9px] bg-emerald-900 text-emerald-300 border border-emerald-700 px-1.5 py-0.5 rounded font-bold" id="zoiKarma">Karma: Neutral</span>
        </div>
      </div>

      <div class="text-right">
        <div class="text-xs font-black text-amber-400" id="statCash">₦120,000</div>
        <div class="text-[9px] text-gray-300" id="statTime">02:45 PM | Yaba</div>
      </div>
    </header>

    <!-- 3D ISOMETRIC CITY SIMULATION CANVAS -->
    <div class="relative flex-1 bg-slate-900 overflow-hidden">
      <div id="webgl-container" class="w-full h-full"></div>

      <!-- Needs Bar Overlay (inZOI Need System) -->
      <div class="absolute top-2 left-2 right-2 bg-gray-950/80 backdrop-blur-md border border-gray-800 rounded-xl p-2 grid grid-cols-4 gap-1 text-[9px] font-bold text-center z-10">
        <div>
          <span class="text-red-400 block"><i class="fa-solid fa-utensils"></i> Hunger</span>
          <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden mt-0.5"><div id="barHunger" class="bg-red-500 h-full w-[70%]"></div></div>
        </div>
        <div>
          <span class="text-amber-400 block"><i class="fa-solid fa-bolt"></i> Energy</span>
          <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden mt-0.5"><div id="barEnergy" class="bg-amber-400 h-full w-[85%]"></div></div>
        </div>
        <div>
          <span class="text-blue-400 block"><i class="fa-solid fa-comments"></i> Social</span>
          <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden mt-0.5"><div id="barSocial" class="bg-blue-400 h-full w-[50%]"></div></div>
        </div>
        <div>
          <span class="text-purple-400 block"><i class="fa-solid fa-star"></i> Rep</span>
          <div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden mt-0.5"><div id="barRep" class="bg-purple-500 h-full w-[60%]"></div></div>
        </div>
      </div>

      <!-- On-Screen Directional Touch Pad & Action -->
      <div class="absolute bottom-3 left-3 right-3 flex justify-between items-center z-10">
        <!-- D-Pad -->
        <div class="grid grid-cols-3 gap-1 w-28 h-28 opacity-80">
          <div></div>
          <button onclick="moveZoi(0, -1)" class="bg-gray-800 border border-gray-600 rounded-lg text-white font-black text-sm active:bg-emerald-500">▲</button>
          <div></div>
          <button onclick="moveZoi(-1, 0)" class="bg-gray-800 border border-gray-600 rounded-lg text-white font-black text-sm active:bg-emerald-500">◀</button>
          <div class="bg-gray-900 border border-gray-700 rounded-lg flex items-center justify-center text-[8px] text-gray-500">MOVE</div>
          <button onclick="moveZoi(1, 0)" class="bg-gray-800 border border-gray-600 rounded-lg text-white font-black text-sm active:bg-emerald-500">▶</button>
          <div></div>
          <button onclick="moveZoi(0, 1)" class="bg-gray-800 border border-gray-600 rounded-lg text-white font-black text-sm active:bg-emerald-500">▼</button>
          <div></div>
        </div>

        <!-- Action Target Button -->
        <button onclick="interactTarget()" class="w-16 h-16 rounded-full bg-gradient-to-tr from-emerald-500 to-amber-400 text-black font-black text-xs shadow-xl flex flex-col items-center justify-center border-2 border-white active:scale-90">
          <i class="fa-solid fa-person-walking-arrow-loop-left text-lg"></i>
          <span>ACTION</span>
        </button>
      </div>
    </div>

    <!-- AI Street Interaction Modal -->
    <div id="aiModal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-md z-40 p-4 flex flex-col justify-end">
      <div class="bg-gray-900 border border-emerald-500/50 rounded-2xl p-4 space-y-3">
        <div class="flex items-center gap-3 border-b border-gray-800 pb-2">
          <div class="text-3xl" id="npcIcon">👮‍♂️</div>
          <div>
            <h4 class="text-xs font-black text-amber-400" id="npcTitle">Police Checkpoint</h4>
            <p class="text-[10px] text-gray-400" id="npcSubtitle">Random Event</p>
          </div>
        </div>
        
        <p class="text-xs text-gray-200 leading-relaxed font-mono bg-gray-950 p-3 rounded-xl border border-gray-800" id="npcBody">
          "Show your driver's license and vehicle registration!"
        </p>

        <div class="grid grid-cols-1 gap-2 pt-1" id="npcOptions">
          <button onclick="resolveAction('pay')" class="py-2.5 bg-emerald-600 text-black font-extrabold text-xs rounded-xl">
            Settle quietly (-₦3,000)
          </button>
          <button onclick="resolveAction('decline')" class="py-2.5 bg-gray-800 text-amber-400 font-extrabold text-xs rounded-xl border border-gray-700">
            Show valid credentials (+10 Rep)
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="p-2.5 bg-gray-950 border-t border-gray-800 flex justify-around text-[10px] font-extrabold text-gray-400">
      <button class="text-emerald-400 flex flex-col items-center"><i class="fa-solid fa-city text-base"></i> World</button>
      <button onclick="alert('Business Hub: Buy POS Stands & Real Estate coming next!')" class="flex flex-col items-center"><i class="fa-solid fa-shop text-base"></i> Business</button>
      <button onclick="alert('Leaderboard: Edo Poly vs UNILAG active!')" class="flex flex-col items-center"><i class="fa-solid fa-trophy text-base"></i> Turfs</button>
    </nav>
  </div>

  <script>
    // Three.js 3D Isometric View Setup
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    // Isometric Camera
    const aspect = container.clientWidth / container.clientHeight;
    const d = 10;
    const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 0.1, 1000);
    camera.position.set(10, 10, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xfbbf24, 0.8);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    // Create 3D Ground (Lagos Street Grid)
    const gridHelper = new THREE.GridHelper(20, 20, 0x10b981, 0x1e293b);
    scene.add(gridHelper);

    // Create Zoi Character (3D Box/Avatar)
    const playerGeo = new THREE.BoxGeometry(0.8, 1.6, 0.8);
    const playerMat = new THREE.MeshLambertMaterial({ color: 0xfbbf24 });
    const zoiMesh = new THREE.Mesh(playerGeo, playerMat);
    zoiMesh.position.set(0, 0.8, 0);
    scene.add(zoiMesh);

    // Create Buildings / Points of Interest
    function createBuilding(x, z, color, label) {
      const geo = new THREE.BoxGeometry(2, 3, 2);
      const mat = new THREE.MeshLambertMaterial({ color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 1.5, z);
      scene.add(mesh);
    }

    createBuilding(-4, -4, 0x008751); // POS Stand
    createBuilding(4, -4, 0xef4444);  // Bukka Food
    createBuilding(-4, 4, 0x3b82f6);  // Tech Hub

    // Animation Render Loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // Movement Controls
    function moveZoi(dx, dz) {
      zoiMesh.position.x += dx * 0.5;
      zoiMesh.position.z += dz * 0.5;

      // Camera Follows Zoi
      camera.position.x = zoiMesh.position.x + 10;
      camera.position.z = zoiMesh.position.z + 10;
      camera.lookAt(zoiMesh.position);

      checkInteractions();
    }

    // Proximity Interactions
    function checkInteractions() {
      const distToPOS = Math.hypot(zoiMesh.position.x - (-4), zoiMesh.position.z - (-4));
      if (distToPOS < 1.5) {
        showModal('🏧', 'POS Agent Stand', 'Hustle Spot', 'Run transactions to earn cash and raise your street rep.', 'work');
      }
    }

    function showModal(icon, title, subtitle, body, type) {
      document.getElementById('npcIcon').innerText = icon;
      document.getElementById('npcTitle').innerText = title;
      document.getElementById('npcSubtitle').innerText = subtitle;
      document.getElementById('npcBody').innerText = body;
      document.getElementById('aiModal').classList.remove('hidden');
    }

    function resolveAction(choice) {
      document.getElementById('aiModal').classList.add('hidden');
      if (choice === 'pay') {
        alert("Action completed!");
      }
    }
  </script>
</body>
</html>
