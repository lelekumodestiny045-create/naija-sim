<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NAIJA TURF: Living Nigeria Simulation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap');
    * { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    #streetCanvas {
      background: #111827;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex justify-center items-center overflow-hidden">

  <!-- Main Mobile Game Container -->
  <div id="gameApp" class="w-full max-w-[420px] h-[100dvh] bg-gray-900 flex flex-col justify-between relative shadow-2xl border-x border-gray-800">

    <!-- Top Real-Time Status Bar -->
    <header class="p-3 bg-emerald-950/90 border-b border-emerald-800/60 flex justify-between items-center z-20">
      <div>
        <div class="text-[10px] uppercase font-black text-emerald-400 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <span id="zoneName">Lagos Street (Yaba)</span>
        </div>
        <div class="text-xs font-extrabold text-white" id="playerName">Lekki Hustler (LVL 1)</div>
      </div>
      <div class="text-right">
        <div class="text-xs font-black text-amber-400" id="cashStat">₦75,000</div>
        <div class="text-[10px] text-gray-300" id="fuelStat">⛽ Fuel: 100%</div>
      </div>
    </header>

    <!-- REAL-TIME 2D CANVAS STREET VIEW -->
    <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
      <canvas id="streetCanvas" width="380" height="420" class="rounded-xl border border-gray-800 shadow-inner"></canvas>
      
      <!-- Overlay Toast / AI Event Alert -->
      <div id="eventOverlay" class="absolute top-3 left-3 right-3 bg-red-950/90 border border-red-700 p-2.5 rounded-xl text-xs flex justify-between items-center hidden animate-bounce">
        <span class="font-black text-red-200" id="eventText">🚨 LASTMA Checkpoint ahead!</span>
        <button onclick="dismissEvent()" class="bg-red-500 text-black font-extrabold text-[10px] px-2 py-1 rounded">DEAL</button>
      </div>

      <!-- Controls Layer (D-Pad Joystick) -->
      <div class="absolute bottom-4 left-4 right-4 flex justify-between items-center z-10 opacity-80">
        <!-- Directional D-Pad -->
        <div class="grid grid-cols-3 gap-1 w-32 h-32">
          <div></div>
          <button onmousedown="movePlayer('up')" ontouchstart="movePlayer('up')" class="bg-gray-800 border border-gray-600 rounded-lg text-white text-lg flex items-center justify-center font-black active:bg-emerald-500">▲</button>
          <div></div>
          <button onmousedown="movePlayer('left')" ontouchstart="movePlayer('left')" class="bg-gray-800 border border-gray-600 rounded-lg text-white text-lg flex items-center justify-center font-black active:bg-emerald-500">◀</button>
          <div class="bg-gray-900 rounded-lg border border-gray-700 flex items-center justify-center text-[9px] text-gray-500 font-bold">PAD</div>
          <button onmousedown="movePlayer('right')" ontouchstart="movePlayer('right')" class="bg-gray-800 border border-gray-600 rounded-lg text-white text-lg flex items-center justify-center font-black active:bg-emerald-500">▶</button>
          <div></div>
          <button onmousedown="movePlayer('down')" ontouchstart="movePlayer('down')" class="bg-gray-800 border border-gray-600 rounded-lg text-white text-lg flex items-center justify-center font-black active:bg-emerald-500">▼</button>
          <div></div>
        </div>

        <!-- Action Button -->
        <button onclick="interactStreet()" class="w-16 h-16 rounded-full bg-gradient-to-tr from-emerald-500 to-amber-400 text-black font-black text-xs shadow-lg flex flex-col items-center justify-center border-2 border-white active:scale-90">
          <i class="fa-solid fa-hand text-base"></i>
          <span>ACTION</span>
        </button>
      </div>
    </div>

    <!-- AI Street NPC Conversation Modal -->
    <div id="aiModal" class="hidden absolute inset-0 bg-black/85 backdrop-blur-md z-40 p-4 flex flex-col justify-end">
      <div class="bg-gray-900 border border-emerald-500/50 rounded-2xl p-4 space-y-3">
        <div class="flex items-center gap-3 border-b border-gray-800 pb-2">
          <div class="text-3xl" id="npcAvatar">👮‍♂️</div>
          <div>
            <h4 class="text-xs font-black text-amber-400" id="npcName">Officer Danladi (LASTMA)</h4>
            <p class="text-[10px] text-gray-400">Street Interaction</p>
          </div>
        </div>
        
        <p class="text-xs text-gray-200 leading-relaxed font-mono bg-gray-950 p-3 rounded-xl border border-gray-800" id="npcDialog">
          "Oga, your vehicle particulars don expire since yesterday! Park here!"
        </p>

        <div class="grid grid-cols-1 gap-2 pt-1" id="npcChoices">
          <button onclick="replyNPC('bribe')" class="py-2.5 bg-emerald-600 text-black font-extrabold text-xs rounded-xl">
            Offer ₦2,000 "for water" (-₦2,000)
          </button>
          <button onclick="replyNPC('argue')" class="py-2.5 bg-gray-800 text-amber-400 font-extrabold text-xs rounded-xl border border-gray-700">
            Argue and call Big Uncle (-20 Rep)
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="p-3 bg-gray-950 border-t border-gray-800 flex justify-around text-[11px] font-extrabold text-gray-400">
      <button class="text-emerald-400 flex flex-col items-center gap-0.5"><i class="fa-solid fa-street-view text-base"></i> Street</button>
      <button onclick="alert('Business Hub: Buy POS Stands & Real Estate coming next!')" class="flex flex-col items-center gap-0.5"><i class="fa-solid fa-building text-base"></i> Assets</button>
      <button onclick="alert('Leaderboard: Edo Poly vs UNILAG rivalry active!')" class="flex flex-col items-center gap-0.5"><i class="fa-solid fa-trophy text-base"></i> Turfs</button>
    </nav>
  </div>

  <script>
    const canvas = document.getElementById('streetCanvas');
    const ctx = canvas.getContext('2d');

    // Player State & Position
    let player = { x: 180, y: 300, speed: 12, size: 16 };
    let cash = 75000;

    // NPC & Street Objects
    let npcs = [
      { x: 80, y: 100, type: 'mama_put', label: '🍲 Mama Put', icon: '🍲' },
      { x: 280, y: 150, type: 'pos_stand', label: '🏧 POS Agent', icon: '🏧' },
      { x: 180, y: 60, type: 'lastma', label: '👮‍♂️ Checkpoint', icon: '👮‍♂️' }
    ];

    let cars = [
      { x: 0, y: 200, speed: 3, color: '#f59e0b', label: 'Danfo' }
    ];

    // Main Game Render Loop
    function gameLoop() {
      // Clear canvas
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Roads
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 180, canvas.width, 60); // Main Street
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(0, 208, canvas.width, 4); // Yellow dividing line

      // Move & Draw Vehicles (Danfo traffic)
      cars.forEach(car => {
        car.x += car.speed;
        if (car.x > canvas.width) car.x = -60;
        ctx.fillStyle = car.color;
        ctx.fillRect(car.x, car.y, 45, 24);
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px sans-serif';
        ctx.fillText('🚌 DANFO', car.x + 2, car.y + 16);
      });

      // Draw NPCs / Locations
      npcs.forEach(npc => {
        ctx.fillStyle = '#022c22';
        ctx.beginPath();
        ctx.arc(npc.x, npc.y, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#10b981';
        ctx.stroke();

        ctx.font = '14px sans-serif';
        ctx.fillText(npc.icon, npc.x - 7, npc.y + 5);

        ctx.fillStyle = '#9ca3af';
        ctx.font = '9px sans-serif';
        ctx.fillText(npc.label, npc.x - 24, npc.y - 22);
      });

      // Draw Player Character
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#008751';
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '10px sans-serif';
      ctx.fillText('YOU', player.x - 10, player.y + 4);

      requestAnimationFrame(gameLoop);
    }

    // Controls
    function movePlayer(dir) {
      if (dir === 'up') player.y = Math.max(30, player.y - player.speed);
      if (dir === 'down') player.y = Math.min(canvas.height - 30, player.y + player.speed);
      if (dir === 'left') player.x = Math.max(30, player.x - player.speed);
      if (dir === 'right') player.x = Math.min(canvas.width - 30, player.x + player.speed);

      checkProximity();
    }

    function checkProximity() {
      npcs.forEach(npc => {
        let dist = Math.hypot(player.x - npc.x, player.y - npc.y);
        if (dist < 30) {
          triggerNPCInteraction(npc);
        }
      });
    }

    function triggerNPCInteraction(npc) {
      const modal = document.getElementById('aiModal');
      modal.classList.remove('hidden');

      if (npc.type === 'lastma') {
        document.getElementById('npcAvatar').innerText = '👮‍♂️';
        document.getElementById('npcName').innerText = 'Officer Danladi (LASTMA)';
        document.getElementById('npcDialog').innerText = '"Oga, your seatbelt no tight! Park here before I tow your vehicle!"';
      } else if (npc.type === 'pos_stand') {
        document.getElementById('npcAvatar').innerText = '🏧';
        document.getElementById('npcName').innerText = 'Blessing POS Hub';
        document.getElementById('npcDialog').innerText = '"Welcome boss! You wan cash out or you wan transfer?"';
      } else if (npc.type === 'mama_put') {
        document.getElementById('npcAvatar').innerText = '🍲';
        document.getElementById('npcName').innerText = 'Mama Caro Bukka';
        document.getElementById('npcDialog').innerText = '"Hot Eba, Egusi, and Goat meat dey ready. How much own you wan chop?"';
      }
    }

    function replyNPC(choice) {
      document.getElementById('aiModal').classList.add('hidden');
      if (choice === 'bribe') {
        cash -= 2000;
        document.getElementById('cashStat').innerText = `₦${cash.toLocaleString()}`;
        alert("Officer let you go with a salute! (-₦2,000)");
      } else {
        alert("You argued for 30 minutes! Energy reduced.");
      }
    }

    // Start 2D Simulation
    gameLoop();
  </script>
</body>
</html>
